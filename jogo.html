<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131f">
  <title>Jogo — Estação 2</title>
  <style>
    :root{color-scheme:dark;--bg:#10131f;--panel:#191e2e;--line:#2a3249;--ink:#f4f5fc;--muted:#a7aec4;--mint:#56e0c0;--violet:#9d83ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 4%,#39306b66,transparent 30rem),var(--bg);color:var(--ink)}a{color:inherit;text-decoration:none}.wrap{width:min(1000px,calc(100% - 36px));margin:auto}.top{border-bottom:1px solid #ffffff12}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:900;letter-spacing:.13em}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--mint),var(--violet));color:#111523}.back{color:var(--muted);font-size:13px}main{padding:30px 0 54px}.crumb{color:var(--muted);font-size:12px;margin-bottom:20px}.heading{margin-bottom:20px}.genre{color:var(--mint);font-size:11px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(28px,5vw,46px);letter-spacing:-.045em;margin:7px 0}.subtitle{color:var(--muted);margin:0}.screen{min-height:310px;display:grid;place-items:center;padding:28px;border:1px solid #ffffff1b;border-radius:18px;background:radial-gradient(ellipse at 50% 60%,#38405e,transparent 55%),linear-gradient(140deg,#191e2e,#080a11);text-align:center}.screen h2{font-size:clamp(22px,4vw,34px);margin:0 0 10px}.screen p{max-width:580px;margin:0 auto 20px;color:var(--muted);font-size:14px;line-height:1.65}.action{display:inline-flex;gap:9px;align-items:center;background:var(--mint);color:#10131f;font-weight:900;border-radius:11px;padding:13px 18px}.action:hover{filter:brightness(1.08)}.details{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.panel{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:20px}.panel h3{margin:0 0 10px;font-size:16px}.panel p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}.notice{border-left:3px solid var(--violet)}footer{border-top:1px solid #ffffff12;padding:22px 0;color:var(--muted);font-size:12px}@media(max-width:650px){.details{grid-template-columns:1fr}.screen{min-height:260px}}
  </style>
</head>
<body><header class="top"><div class="wrap nav"><a class="brand" href="index.html"><span class="mark">◈</span> ESTAÇÃO 2</a><a class="back" href="index.html">← Voltar para os jogos</a></div></header>
  <main class="wrap"><div class="crumb"><a href="index.html">Início</a>　/　<span id="crumb">Jogo</span></div><div class="heading"><span class="genre" id="genre"></span><h1 id="title">Carregando…</h1><p class="subtitle" id="subtitle"></p></div>
    <section class="screen"><div><h2 id="screenTitle"></h2><p id="screenText"></p><a class="action" id="play" hidden>▶　Play</a></div></section>
    <div class="details"><section class="panel"><h3>Sobre o jogo</h3><p id="description"></p></section><aside class="panel notice"><h3>Como funciona</h3><p id="notice"></p></aside></div>
  </main><footer><div class="wrap">Estação 2 · Biblioteca local de jogos completos.</div></footer>
  <script>
    const games={
      'dragon-ball':{title:'Dragon Ball Z: Budokai',genre:'Luta · PlayStation 2',available:false,description:'O ISO deste jogo ainda não foi configurado neste site.',notice:'Para iniciar o jogo completo, é necessário ter o arquivo ISO e adicionar seu caminho ao iniciador do PCSX2.'},
      'need-for-speed':{title:'Need for Speed',genre:'Corrida · PlayStation 2',available:false,description:'O ISO deste jogo ainda não foi configurado neste site.',notice:'Para iniciar o jogo completo, é necessário ter o arquivo ISO e adicionar seu caminho ao iniciador do PCSX2.'},
      naruto:{title:'Naruto: Ultimate Ninja',genre:'Luta · PlayStation 2',available:false,description:'O ISO deste jogo ainda não foi configurado neste site.',notice:'Para iniciar o jogo completo, é necessário ter o arquivo ISO e adicionar seu caminho ao iniciador do PCSX2.'},
      'guitar-hero':{title:'Guitar Hero Flash Back',genre:'Ritmo · PlayStation 2',available:true,description:'O ISO completo que você indicou está configurado para iniciar no PCSX2 instalado no computador.',notice:'O PCSX2 é um aplicativo de Windows e não roda dentro do navegador. Clique em Play para baixar um pequeno iniciador e abra o arquivo baixado. Ele inicia o ISO no PCSX2 em tela cheia. Na primeira execução, talvez seja preciso indicar a pasta da BIOS.'}
    };
    const key=new URLSearchParams(location.search).get('jogo')||'guitar-hero',g=games[key]||games['guitar-hero'];document.title=g.title+' — Estação 2';document.querySelector('#title').textContent=g.title;document.querySelector('#crumb').textContent=g.title;document.querySelector('#genre').textContent=g.genre;document.querySelector('#description').textContent=g.description;document.querySelector('#notice').textContent=g.notice;document.querySelector('#subtitle').textContent=g.available?'Jogo completo disponível no PCSX2.':'Jogo completo indisponível até configurar o arquivo do jogo.';document.querySelector('#screenTitle').textContent=g.available?g.title:'ISO ainda não configurado';document.querySelector('#screenText').textContent=g.available?'O botão Play prepara o iniciador local. Depois, abra o arquivo baixado para iniciar o jogo.':'Nenhuma demo será iniciada. Este título só ficará disponível quando o ISO completo for configurado.';
    if(g.available){const a=document.querySelector('#play');a.hidden=false;a.href='Jogar-Guitar-Hero-no-PCSX2.cmd';a.setAttribute('download','Jogar-Guitar-Hero-no-PCSX2.cmd')}
  </script>
</body></html>
